[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-hunter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []  # runtime deps listed in requirements.txt

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
